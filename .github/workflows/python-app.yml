# Прогон unit-тестов на всех поддерживаемых версиях Python
#
# Workflow вызывается тремя способами:
# При push/PR, а также из release.yml через workflow_call, чтобы релиз не дублировал матрицу

name: Run Tests

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # Не отменять остальные версии из-за падения одной: важно видеть всю картину совместимости
      fail-fast: false
      matrix:
        include:
          # Для 3.8 и 3.9 нужен ubuntu-22.04: в образ ubuntu-24.04 сборки этих версий
          # не поставляются, и setup-python на нём падает с "version not found"
          - { python-version: "3.8", os: ubuntu-22.04 }
          - { python-version: "3.9", os: ubuntu-22.04 }
          - { python-version: "3.10", os: ubuntu-latest }
          - { python-version: "3.11", os: ubuntu-latest }
          - { python-version: "3.12", os: ubuntu-latest }
          - { python-version: "3.13", os: ubuntu-latest }
          # Основная среда разработки - Windows
          - { python-version: "3.12", os: windows-latest }

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Check import and version
        # Самая частая поломка совместимости - падение на импорте из-за синтаксиса аннотаций,
        # который в старых версиях Python недоступен; проверка этого отдельно от тестов
        run: python -c "import pycustomrand; print('pycustomrand', pycustomrand.__version__)"

      - name: Test with unittest
        run: python -m unittest discover tests -v
